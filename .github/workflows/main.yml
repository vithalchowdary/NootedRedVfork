name: Test

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      AppleForgePath: ${{ github.workspace }}/AppleForge
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: clang --version
      - run: git clone --recurse-submodules https://git.chefkiss.dev/AppleHax/AppleForge.git
      - run: brew install xmake
      - run: xmake f -m debug -y && xmake -y
      - run: xmake f -m releasedbg -y && xmake -y
      - run: xmake f -m release -y && xmake -y
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/*/*/*/*.zip
